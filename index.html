<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Руб Ап — Океанграм</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--tg-theme-bg-color, #121212);
      color: var(--tg-theme-text-color, #ffffff);
      margin: 0; padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #1e1e24);
      border-radius: 16px; padding: 16px;
    }
    .balance-row { display: flex; justify-content: space-between; align-items: center; }
    .balance-val { font-size: 28px; font-weight: 800; color: #4ade80; }
    button {
      background: #3b82f6; color: white; border: none;
      border-radius: 12px; padding: 12px 16px; font-size: 16px;
      font-weight: 600; cursor: pointer; width: 100%;
    }
    button:active { opacity: 0.85; }
    .stars-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .star-btn { background: #eab308; color: #000; padding: 10px; font-size: 14px; }
    input[type="number"], input[type="range"] { width: 100%; margin-top: 8px; box-sizing: border-box; }
    input[type="number"] {
      padding: 12px; border-radius: 10px; border: 1px solid #333;
      background: #121212; color: #fff; font-size: 16px;
    }
    .stats { display: flex; justify-content: space-between; margin: 12px 0; font-size: 15px; }
    #result { text-align: center; font-weight: bold; min-height: 24px; }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 13px; opacity: 0.7;">Ваш баланс</div>
    <div class="balance-row">
      <div class="balance-val"><span id="balance">0.00</span> ₽</div>
    </div>
    <div style="font-size: 13px; opacity: 0.7; margin-top: 12px;">Пополнить за Telegram Stars (1 ⭐️ = 1.5 ₽):</div>
    <div class="stars-grid">
      <button class="star-btn" onclick="buyStars(10)">+15 ₽ (10 ⭐️)</button>
      <button class="star-btn" onclick="buyStars(50)">+75 ₽ (50 ⭐️)</button>
      <button class="star-btn" onclick="buyStars(100)">+150 ₽ (100 ⭐️)</button>
    </div>
  </div>

  <div class="card">
    <div style="font-weight: 700; font-size: 18px;">🚀 Руб Ап (Апгрейд)</div>
    
    <div style="margin-top: 12px;">
      <label style="font-size: 13px; opacity: 0.8;">Сумма ставки (₽):</label>
      <input type="number" id="betInput" value="10" min="1">
    </div>

    <div style="margin-top: 14px;">
      <label style="font-size: 13px; opacity: 0.8;">Множитель: <b id="multLabel">x2.0</b></label>
      <input type="range" id="multSlider" min="1.2" max="10" step="0.1" value="2.0" oninput="updateCalc()">
    </div>

    <div class="stats">
      <span>Шанс: <b id="chanceLabel" style="color:#60a5fa;">47.5%</b></span>
      <span>Выигрыш: <b id="winLabel" style="color:#4ade80;">20.00 ₽</b></span>
    </div>

    <button onclick="doUpgrade()" style="background: #22c55e; font-size: 18px;">АПГРЕЙДНУТЬ</button>
    <div id="result" style="margin-top: 12px;"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function loadUser() {
      const res = await fetch('/api/user', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg.initData })
      });
      const data = await res.json();
      if (data.balance !== undefined) {
        document.getElementById('balance').innerText = data.balance.toFixed(2);
      }
    }

    function updateCalc() {
      const bet = parseFloat(document.getElementById('betInput').value) || 0;
      const mult = parseFloat(document.getElementById('multSlider').value);
      const chance = ((100 / mult) * 0.95).toFixed(1);
      document.getElementById('multLabel').innerText = 'x' + mult.toFixed(1);
      document.getElementById('chanceLabel').innerText = chance + '%';
      document.getElementById('winLabel').innerText = (bet * mult).toFixed(2) + ' ₽';
    }
    document.getElementById('betInput').addEventListener('input', updateCalc);

    async function buyStars(stars) {
      const res = await fetch('/api/create_invoice', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg.initData, stars })
      });
      const data = await res.json();
      if (data.invoice_link) {
        tg.openInvoice(data.invoice_link, (status) => {
          if (status === 'paid') {
            setTimeout(loadUser, 1000); // Обновляем баланс после оплаты
          }
        });
      }
    }

    async function doUpgrade() {
      const bet = parseFloat(document.getElementById('betInput').value);
      const multiplier = parseFloat(document.getElementById('multSlider').value);
      const resEl = document.getElementById('result');
      resEl.innerText = 'Крутим...';

      const res = await fetch('/api/upgrade', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg.initData, bet, multiplier })
      });
      const data = await res.json();

      if (!res.ok) {
        resEl.style.color = '#f87171';
        resEl.innerText = data.detail || 'Ошибка';
        return;
      }

      document.getElementById('balance').innerText = data.balance.toFixed(2);
      if (data.win) {
        resEl.style.color = '#4ade80';
        resEl.innerText = `🎉 Успех! Выигрыш +${data.win_amount.toFixed(2)} ₽`;
      } else {
        resEl.style.color = '#f87171';
        resEl.innerText = `💥 Не повезло (шанс был ${data.chance}%)`;
      }
    }

    loadUser();
  </script>
</body>
</html>
